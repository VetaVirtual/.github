name: ZenHub move
on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      repo_gh_id:
        required: true
        type: string
      workspace_id:
        required: true
        type: string
      in_progress_pipeline_id:
        required: true
        type: string
    secrets:
      ZENHUB_TOKEN:
        required: true
jobs:
  move-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Move matching ZenHub issue to In Progress
        env:
          ZENHUB_TOKEN: ${{ secrets.ZENHUB_TOKEN }}
          ZENHUB_WORKSPACE_ID: ${{ inputs.workspace_id }}
          IN_PROGRESS_PIPELINE_ID: ${{ inputs.in_progress_pipeline_id }}
          REPO_GH_ID: ${{ inputs.repo_gh_id }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(printf '%s' "$BRANCH_NAME" | grep -oE '#[0-9]+' | head -n1 | tr -d '#' || true)"
          [ -z "$ISSUE_NUMBER" ] && { echo "No issue number in '$BRANCH_NAME'. Skipping."; exit 0; }
          API="https://api.zenhub.com/public/graphql"
          LOOKUP=$(jq -n --argjson r "$REPO_GH_ID" --argjson n "$ISSUE_NUMBER" \
            '{query:"query($r:Int!,$n:Int!){issueByInfo(repositoryGhId:$r,issueNumber:$n){id}}",variables:{r:$r,n:$n}}')
          RESP=$(curl -sS -X POST "$API" -H "Authorization: Bearer $ZENHUB_TOKEN" -H "Content-Type: application/json" -d "$LOOKUP")
          ISSUE_ID=$(printf '%s' "$RESP" | jq -r '.data.issueByInfo.id // empty')
          [ -z "$ISSUE_ID" ] && { echo "No ZenHub issue for #$ISSUE_NUMBER. Resp: $RESP"; exit 0; }
          MOVE=$(jq -n --arg i "$ISSUE_ID" --arg p "$IN_PROGRESS_PIPELINE_ID" \
            '{query:"mutation($in:MoveIssueInput!){moveIssue(input:$in){issue{id}}}",variables:{in:{pipelineId:$p,issueId:$i,position:0}}}')
          curl -sS -X POST "$API" -H "Authorization: Bearer $ZENHUB_TOKEN" -H "Content-Type: application/json" -d "$MOVE"
