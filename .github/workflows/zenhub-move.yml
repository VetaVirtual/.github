name: ZenHub move
on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      repo_gh_id:
        required: true
        type: string
      workspace_id:
        required: true
        type: string
      pipeline_id:
        required: false
        type: string
        default: ''
      in_progress_pipeline_id:
        required: false
        type: string
        default: ''
    secrets:
      ZENHUB_TOKEN:
        required: true
jobs:
  move-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Move the issues named in the branch to the target pipeline
        env:
          ZENHUB_TOKEN: ${{ secrets.ZENHUB_TOKEN }}
          TARGET_PIPELINE_ID: ${{ inputs.pipeline_id != '' && inputs.pipeline_id || inputs.in_progress_pipeline_id }}
          REPO_GH_ID: ${{ inputs.repo_gh_id }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail
          [ -z "$TARGET_PIPELINE_ID" ] && { echo "No target pipeline id given (pipeline_id or in_progress_pipeline_id)."; exit 1; }
          ISSUE_NUMBERS="$(printf '%s' "$BRANCH_NAME" | grep -oE '#[0-9]+' | tr -d '#' | sort -un || true)"
          [ -z "$ISSUE_NUMBERS" ] && { echo "No issue number in '$BRANCH_NAME'. Skipping."; exit 0; }
          API="https://api.zenhub.com/public/graphql"
          for ISSUE_NUMBER in $ISSUE_NUMBERS; do
            LOOKUP=$(jq -n --argjson r "$REPO_GH_ID" --argjson n "$ISSUE_NUMBER" \
              '{query:"query($r:Int!,$n:Int!){issueByInfo(repositoryGhId:$r,issueNumber:$n){id}}",variables:{r:$r,n:$n}}')
            RESP=$(curl -sS -X POST "$API" -H "Authorization: Bearer $ZENHUB_TOKEN" -H "Content-Type: application/json" -d "$LOOKUP")
            ISSUE_ID=$(printf '%s' "$RESP" | jq -r '.data.issueByInfo.id // empty')
            [ -z "$ISSUE_ID" ] && { echo "No ZenHub issue for #$ISSUE_NUMBER. Resp: $RESP"; continue; }
            MOVE=$(jq -n --arg i "$ISSUE_ID" --arg p "$TARGET_PIPELINE_ID" \
              '{query:"mutation($in:MoveIssueInput!){moveIssue(input:$in){issue{id}}}",variables:{in:{pipelineId:$p,issueId:$i,position:0}}}')
            echo "Moving #$ISSUE_NUMBER"
            curl -sS -X POST "$API" -H "Authorization: Bearer $ZENHUB_TOKEN" -H "Content-Type: application/json" -d "$MOVE"
            echo
          done
